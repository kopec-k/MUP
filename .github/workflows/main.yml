name: test
on: push
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - run: pip install nbformat nbclient ipykernel
      - run: python -c "print('hello!')"
      - uses: actions/checkout@v7
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: True
      - run: quarto render mup.ipynb --execute --to pdf
      - uses: actions/upload-artifact@v7
        with:
          path: raport.pdf
          archive: true
